# Controller boards that shields plug into: the module that carries the
# microcontroller, the radio and the bootloader. A shield's firmware profile
# names one by `id`; the board's halves then need no bootloader facts of
# their own. The ZMK board names and connectors are from ZMK v0.3.0's
# board metadata (app/boards/arm/*/*.zmk.yml, MIT). Bootloader volume names
# are from each bootloader's own source (UF2_VOLUME_LABEL in
# adafruit/Adafruit_nRF52_Bootloader src/boards/*/board.h, and Seeed's and
# Keycapsss's builds of it); RP2040 boards use the chip's own bootloader,
# which always mounts as RPI-RP2. UF2 family IDs are from
# microsoft/uf2 utils/uf2families.json.

[[controllers]]
id = "nice_nano_v2"
name = "nice!nano v2"
board = "nice_nano_v2"
connector = "pro_micro"
bootloader_volumes = ["NICENANO"]
uf2_family = 0xADA52840
bootloader_entry = "Double-tap the reset button, or short the RST and GND pins together twice quickly."
notes = ["Supermini nRF52840 clones ship with the same bootloader and are built as a nice!nano v2."]

