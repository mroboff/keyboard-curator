# MoErgo Go60. Transcribed from https://github.com/moergo-sc/zmk at tag v26.09:
# app/boards/arm/go60/go60-layouts.dtsi, go60.dtsi and go60_*_defconfig.
# Earlier tags have the physical layout in the wrong order.

id = "moergo-go60"
name = "Go60"
vendor = "MoErgo"
# MoErgo voids the warranty above this (CONFIG_ZMK_RGB_UNDERGLOW_BRT_MAX).
brightness_cap = 40
default_layout = "physical_layout0"
# The plain keys of the vendor's factory base layer, in binding order, used
# to start new projects. Empty entries are left transparent.
starter_keys = [
  "EQUAL", "N1", "N2", "N3", "N4", "N5", "N6", "N7", "N8", "N9", "N0", "MINUS",
  "TAB", "Q", "W", "E", "R", "T", "Y", "U", "I", "O", "P", "BSLH",
  "ESC", "A", "S", "D", "F", "G", "H", "J", "K", "L", "SEMI", "SQT",
  "", "Z", "X", "C", "V", "B", "N", "M", "COMMA", "DOT", "FSLH", "",
  "GRAVE", "DEL", "BSPC", "LGUI", "LBKT", "RBKT",
  "", "LSHFT", "LCTRL", "LALT", "SPACE", "",
]

# From go60_lh_defconfig. Only the left half has USB; the IDs are shared with
# MoErgo's other keyboards.
[[usb]]
vendor = 0x16c0
product = 0x27db
name = "Go60 Left"

[flash]
order = ["right", "left"]
bootloader_entry = "Press the bootloader key on the Magic layer for that half, or hold the half's bootloader key combination while powering it on."

# LED chains are the `pixel-lookup` tables from the community per-key lighting
# branch (https://github.com/moergo-sc/zmk/pull/36), which runs on real Go60s.

[[halves]]
side = "left"
central = true
bootloader_volume = "GO60LHBOOT"
uf2_family = 0x9809B007

[halves.leds]
layout = "physical_layout0"
verified = true
chain = [
  54, 55, 56, 5, 17, 29, 41, 4, 16, 28,
  40, 50, 3, 15, 27, 39, 49, 2, 14, 26,
  38, 48, 1, 13, 25, 37, 0, 12, 24, 36,
]

[[halves]]
side = "right"
central = false
bootloader_volume = "GO60RHBOOT"
uf2_family = 0x980AB007

[halves.leds]
layout = "physical_layout0"
verified = true
chain = [
  59, 58, 57, 6, 18, 30, 42, 7, 19, 31,
  43, 51, 8, 20, 32, 44, 52, 9, 21, 33,
  45, 53, 10, 22, 34, 46, 11, 23, 35, 47,
]

[[pointing]]
name = "Left touchpad"
kind = "touchpad"
side = "left"
listener = "cirque_lh_listener"
x = 700
y = 170
size = 180

[[pointing]]
name = "Right touchpad"
kind = "touchpad"
side = "right"
listener = "cirque_rh_listener"
x = 1050
y = 170
size = 180

[[firmware]]
id = "moergo-zmk-26.09"
name = "MoErgo ZMK v26.09"
zephyr = "3.5"
config_name = "go60"
# Pinned to the release whose build container matches this Zephyr.
workflow = "zmkfirmware/zmk/.github/workflows/build-user-config.yml@v0.3.0"
zmk = { url = "https://github.com/moergo-sc/zmk", revision = "v26.09" }
capabilities = ["studio", "rgb-underglow", "rgb-status", "ext-power", "pointing"]

[[firmware.builds]]
side = "left"
board = "go60_lh"

[[firmware.builds]]
side = "right"
board = "go60_rh"

# The community per-key lighting firmware (https://github.com/moergo-sc/zmk/pull/36),
# pinned to a commit. It is based on MoErgo's v25.11, whose physical layout
# is in the wrong order for ZMK Studio, so Studio is not offered with it.
[[firmware]]
id = "moergo-zmk-perkey"
name = "MoErgo ZMK with per-key lighting (community, experimental)"
zephyr = "3.5"
config_name = "go60"
workflow = "zmkfirmware/zmk/.github/workflows/build-user-config.yml@v0.3.0"
zmk = { url = "https://github.com/darknao/zmk", revision = "db2ba9fcd3dec4c7afcf171f123585a9f8292595" }
capabilities = ["rgb-underglow", "rgb-status", "ext-power", "pointing", "per-key-lighting"]
# Its Kconfig limits the starting effect to the four stock ones, so the
# per-key effect cannot be the one the keyboard starts in.
lighting = { transparent = true }

[[firmware.builds]]
side = "left"
board = "go60_lh"

[[firmware.builds]]
side = "right"
board = "go60_rh"

# colonelpanic's moergo-rmk (https://github.com/colonelpanic8/moergo-rmk,
# MIT): RMK with lighting, the Cirque touchpads and a status layer for
# MoErgo's boards, on its own fork of RMK. It is the firmware Moosy
# Research's TailorKey for RMK is built on. It has its own project for the
# Go60, so the app supplies only the keymap, in the same key order as this
# board's layout, and builds inside that project at a pinned commit.
[[firmware]]
id = "moergo-rmk"
name = "RMK for MoErgo (community)"
family = "rmk"
experimental = true
config_name = "go60"
notes = [
  "A different firmware from ZMK: colonelpanic's moergo-rmk, the community firmware behind Moosy Research's TailorKey for RMK. It adds RGB with animations, the touchpads and a status layer. It is not MoErgo firmware, and MoErgo does not support it.",
  "For now this app supplies the keys only: plain keys, layers, mod-taps, layer-taps, sticky keys and combos. Lighting, touchpad and home-row-mod settings stay at that firmware's defaults, and hold-taps, macros and tap-dances defined in a layout are flagged.",
  "Its authors describe it as experimental, and its Go60 image nearly fills the flash, so a large layout may fail to build. A generated keymap has been checked to be accepted by that firmware and to compile; a complete build and a real keyboard have not been tried. Keep MoErgo's firmware files at hand to go back.",
]

[firmware.rmk]
flavor = "moergo-rmk"
source = { url = "https://github.com/colonelpanic8/moergo-rmk", revision = "179bd66bb45f8a12bb8ee2501f592923b023b7d0" }
ble_profiles = 3
project_dir = "crates/go60-rmk"
# That project's lighting and status settings refer to layers by number,
# up to the sixteen its keymap declares.
layers = 16

