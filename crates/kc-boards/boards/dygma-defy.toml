# The release this profile is pinned to, and how a keyboard running it is
# told apart from one running Dygma's own firmware. The Focus commands
# the fork adds (chords.*, timing.*) are facts in kc-dygma's chords.rs
# and timing.rs, transcribed from the fork's CURATOR.md.
[firmware.dygma.fork]
name = "Curator firmware"
repository = "mroboff/NeuronWireless_defy"
tag = "v2.2.1-curator.1"
source_commit = "89dcfeb3ebdbc70a9590da7bbcd0e2fcf68c0ee1"
kaleidoscope_commit = "fc3e1f83ed8049d8e1c9ad1300646d98f950778c"
version_mark = "-curator."
neuron_file = "Wireless_neuron.hex"
keyscanner_file = "keyscanner.bin"

