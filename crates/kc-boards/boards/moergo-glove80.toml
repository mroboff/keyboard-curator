# MoErgo Glove80. Transcribed from https://github.com/moergo-sc/zmk at tag v26.09:
# app/boards/arm/glove80/glove80-layouts.dtsi, glove80.dtsi and
# glove80_*_defconfig. The physical layout is in keymap order there, as in
# the community lighting branch.

id = "moergo-glove80"
name = "Glove80"
vendor = "MoErgo"
# MoErgo voids the warranty above this (CONFIG_ZMK_RGB_UNDERGLOW_BRT_MAX):
# more draws current that can damage the computer.
brightness_cap = 80
default_layout = "physical_layout0"
# The plain keys of the vendor's factory base layer, in binding order, used
# to start new projects. Empty entries are left transparent.
starter_keys = [
  "F1", "F2", "F3", "F4", "F5", "F6", "F7", "F8", "F9", "F10",
  "EQUAL", "N1", "N2", "N3", "N4", "N5", "N6", "N7", "N8", "N9", "N0", "MINUS",
  "TAB", "Q", "W", "E", "R", "T", "Y", "U", "I", "O", "P", "BSLH",
  "ESC", "A", "S", "D", "F", "G", "H", "J", "K", "L", "SEMI", "SQT",
  "GRAVE", "Z", "X", "C", "V", "B", "LSHFT", "LCTRL", "", "LGUI", "RCTRL", "RSHFT", "N", "M", "COMMA", "DOT", "FSLH", "PG_UP",
  "", "HOME", "END", "LEFT", "RIGHT", "BSPC", "DEL", "LALT", "RALT", "RET", "SPACE", "UP", "DOWN", "LBKT", "RBKT", "PG_DN",
]

# From glove80_lh_defconfig. Only the left half has USB; the IDs are shared
# with MoErgo's other keyboards, so the name tells them apart.
[[usb]]
vendor = 0x16c0
product = 0x27db
name = "Glove80 Left"

[flash]
order = ["right", "left"]
bootloader_entry = "Hold the Magic key and press the bootloader key for that half (the outer key of its home row), or hold the half's outer thumb key while powering it on."

# LED chains are the `pixel-lookup` tables from the community per-key lighting
# branch (https://github.com/moergo-sc/zmk/pull/36), app/boards/arm/glove80/
# glove80_lh.dts and glove80_rh.dts: forty LEDs a half, the thumb fan first,
# then the finger columns from the inside out, each from the top down.

[[halves]]
side = "left"
central = true
bootloader_volume = "GLV80LHBOOT"
uf2_family = 0x9807B007

[halves.leds]
layout = "physical_layout0"
verified = true
chain = [
  52, 53, 54, 69, 70, 71, 15, 27, 39, 51,
  4, 14, 26, 38, 50, 68, 3, 13, 25, 37,
  49, 67, 2, 12, 24, 36, 48, 66, 1, 11,
  23, 35, 47, 65, 0, 10, 22, 34, 46, 64,
]

[[halves]]
side = "right"
central = false
bootloader_volume = "GLV80RHBOOT"
uf2_family = 0x9808B007

[halves.leds]
layout = "physical_layout0"
verified = true
chain = [
  57, 56, 55, 74, 73, 72, 16, 28, 40, 58,
  5, 17, 29, 41, 59, 75, 6, 18, 30, 42,
  60, 76, 7, 19, 31, 43, 61, 77, 8, 20,
  32, 44, 62, 78, 9, 21, 33, 45, 63, 79,
]

[[firmware]]
id = "moergo-zmk-26.09"
name = "MoErgo ZMK v26.09"
zephyr = "3.5"
config_name = "glove80"
# Pinned to the release whose build container matches this Zephyr.
workflow = "zmkfirmware/zmk/.github/workflows/build-user-config.yml@v0.3.0"
zmk = { url = "https://github.com/moergo-sc/zmk", revision = "v26.09" }
# No pointing device, but MoErgo's firmware has mouse keys (the Layout
# Editor's HID_POINTING), which TailorKey's Mouse layers use.
capabilities = ["studio", "rgb-underglow", "rgb-status", "ext-power", "pointing"]

[[firmware.builds]]
side = "left"
board = "glove80_lh"

[[firmware.builds]]
side = "right"
board = "glove80_rh"

# The community per-key lighting firmware (https://github.com/moergo-sc/zmk/pull/36),
# pinned to a commit. It is based on MoErgo's v25.11; ZMK Studio has not been
# tried on it, so Studio is not offered with it.
[[firmware]]
id = "moergo-zmk-perkey"
name = "MoErgo ZMK with per-key lighting (community, experimental)"
zephyr = "3.5"
config_name = "glove80"
workflow = "zmkfirmware/zmk/.github/workflows/build-user-config.yml@v0.3.0"
zmk = { url = "https://github.com/darknao/zmk", revision = "db2ba9fcd3dec4c7afcf171f123585a9f8292595" }
capabilities = ["rgb-underglow", "rgb-status", "ext-power", "pointing", "per-key-lighting"]
# Its Kconfig limits the starting effect to the four stock ones, so the
# per-key effect cannot be the one the keyboard starts in.
lighting = { transparent = true }

[[firmware.builds]]
side = "left"
board = "glove80_lh"

[[firmware.builds]]
side = "right"
board = "glove80_rh"

# colonelpanic's moergo-rmk (https://github.com/colonelpanic8/moergo-rmk,
# MIT) for the Glove80, the firmware Moosy Research's TailorKey for RMK is
# built on. As on the Go60, the firmware comes from the project's releases
# and the layout is written to the running keyboard over Rynk; the Glove80
# release publishes its two UF2 files as assets of their own.
[[firmware]]
id = "moergo-rmk"
name = "RMK for MoErgo (community)"
family = "rmk"
experimental = true
config_name = "glove80"
capabilities = [
  "rgb-underglow", "per-key-lighting", "hold-taps", "tap-dance", "mod-morph",
  "macros", "sticky-keys", "opposite-hand-hold",
]
notes = [
  "A different firmware from ZMK: colonelpanic's moergo-rmk, the community firmware behind Moosy Research's TailorKey for RMK. It adds RGB with animations and blinking keys, bilateral home-row mods and a Magic layer. It is not MoErgo firmware, and MoErgo does not support it.",
  "The firmware comes ready-made from the project's release v2026.09.18.1, checked against its checksums, and is flashed once per half. The layout is then written straight to the keyboard over USB: keys, hold-taps and their timing profiles, tap-dances, mod-morphs, macros, combos, and per-key colors with lock and battery lights. Nothing is built.",
  "The firmware keeps every color to 80% of full brightness itself (its channel ceiling is 204 of 255 on both halves), so the brightness setting here is a share of that. Its authors describe it as experimental. Keep MoErgo's firmware files at hand to go back: choose MoErgo's ZMK under Firmware, build it, put each half into its bootloader from the Keyboard tab and flash.",
]

[firmware.rmk]
flavor = "moergo-rmk"
source = { url = "https://github.com/colonelpanic8/moergo-rmk", revision = "179bd66bb45f8a12bb8ee2501f592923b023b7d0" }
# dependencies/rmk at that commit; the app's Rynk client is pinned to the
# same one, so firmware and host speak the same protocol.
rmk_revision = "997b62f54dd29fe7c82f23a2c5b0a18816b4c5ae"
# Four key-selectable profiles (crates/glove80-rmk/keyboard.toml).
ble_profiles = 4
# Its keymap declares sixteen layers.
layers = 16
# The release built from that commit; each half's UF2 is an asset of its own,
# beside SHA256SUMS and manifest.json.
release = { repository = "colonelpanic8/moergo-rmk", tag = "v2026.09.18.1", files = [
  { side = "left", name = "glove80-rmk-0.1.0-lh.uf2" },
  { side = "right", name = "glove80-rmk-0.1.0-rh.uf2" },
] }
# From rmk-palettefx (Effect::NAMES and palettes/*.toml) at the pinned
# submodule, in the firmware's own order.
effects = [
  "Gradient", "Flow", "Vortex", "Sparkle", "Ripple", "Rain", "Reactive",
  "Crosshair", "Tracer", "Keyfall", "Shockwave", "Comet",
]
palettes = [
  "Afterburn", "Amber", "Bad Wolf", "Carnival", "Classic", "Dracula", "Groovy",
  "Not Pink", "Phosphor", "Polarized", "Rose Gold", "Sport", "Synthwave",
  "Thermal", "Viridis", "Watermelon",
]

# The firmware's 6x14 matrix, from the matrix transform in glove80.dtsi,
# in this board's binding order. The left thumb fan is column 6, the right
# column 7; cells (0,5), (0,8), (5,5) and (5,8) have no key.
[firmware.rmk.matrix]
rows = 6
cols = 14
positions = [
  [0, 0], [0, 1], [0, 2], [0, 3], [0, 4], [0, 9], [0, 10], [0, 11], [0, 12], [0, 13],
  [1, 0], [1, 1], [1, 2], [1, 3], [1, 4], [1, 5], [1, 8], [1, 9], [1, 10], [1, 11], [1, 12], [1, 13],
  [2, 0], [2, 1], [2, 2], [2, 3], [2, 4], [2, 5], [2, 8], [2, 9], [2, 10], [2, 11], [2, 12], [2, 13],
  [3, 0], [3, 1], [3, 2], [3, 3], [3, 4], [3, 5], [3, 8], [3, 9], [3, 10], [3, 11], [3, 12], [3, 13],
  [4, 0], [4, 1], [4, 2], [4, 3], [4, 4], [4, 5], [0, 6], [1, 6], [2, 6], [2, 7], [1, 7], [0, 7], [4, 8], [4, 9], [4, 10], [4, 11], [4, 12], [4, 13],
  [5, 0], [5, 1], [5, 2], [5, 3], [5, 4], [3, 6], [4, 6], [5, 6], [5, 7], [4, 7], [3, 7], [5, 9], [5, 10], [5, 11], [5, 12], [5, 13],
]

# Its emitter table (crates/glove80-rmk/keyboard.toml) numbers the left
# half's LEDs 0-39 and the right half's 40-79, each in chain order.
[[firmware.rmk.leds]]
side = "left"
first = 0

[[firmware.rmk.leds]]
side = "right"
first = 40

