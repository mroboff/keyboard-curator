# Aurora Sweep. Generated by the zmk_boards example in kc-import from
# zmkfirmware/zmk at v0.3.0 (MIT): app/boards/shields/splitkb_aurora_sweep/splitkb_aurora_sweep.dtsi,
# app/boards/shields/splitkb_aurora_sweep/splitkb_aurora_sweep_left.overlay,
# app/boards/shields/splitkb_aurora_sweep/splitkb_aurora_sweep_right.overlay,
# app/dts/layouts/cuddlykeyboards/ferris.dtsi.
# Rerun the generator rather than editing this file. Not yet tried on a
# real keyboard.

id = "splitkb-aurora-sweep"
name = "Aurora Sweep"
vendor = "splitkb"
verified = false
brightness_cap = 100
default_layout = "cuddlykeyboards_ferris_layout"
# The plain keys of the shield's own keymap, in binding order.
starter_keys = [
  "Q", "W", "E", "R", "T", "Y", "U", "I", "O", "P", "A", "S",
  "D", "F", "G", "H", "J", "K", "L", "SQT", "", "X", "C", "V",
  "B", "N", "M", "COMMA", "DOT", "", "", "LCTRL", "SPACE", "",
]

[[usb]]
vendor = 0x1d50
product = 0x615e
name = "Aurora Sweep"

[flash]
order = ["left", "right"]

[[halves]]
side = "left"
central = true

[[halves]]
side = "right"
central = false

[[firmware]]
id = "zmk-0.3.0-nice_nano_v2"
name = "ZMK v0.3.0 on nice!nano v2"
zephyr = "3.5"
config_name = "splitkb_aurora_sweep"
workflow = "zmkfirmware/zmk/.github/workflows/build-user-config.yml@v0.3.0"
zmk = { url = "https://github.com/zmkfirmware/zmk", revision = "v0.3.0" }
controller = "nice_nano_v2"
capabilities = ["studio", "ext-power"]
notes = ["Supermini nRF52840 clones ship with the same bootloader and are built as a nice!nano v2."]

[[firmware.builds]]
side = "left"
board = "nice_nano_v2"
shield = "splitkb_aurora_sweep_left"
snippets = ["studio-rpc-usb-uart"]
cmake_args = ["-DCONFIG_ZMK_STUDIO=y"]

[[firmware.builds]]
side = "right"
board = "nice_nano_v2"
shield = "splitkb_aurora_sweep_right"

