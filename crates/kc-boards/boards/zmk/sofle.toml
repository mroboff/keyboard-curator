# Sofle. Generated by the zmk_boards example in kc-import from
# zmkfirmware/zmk at v0.3.0 (MIT): app/boards/shields/sofle/sofle.dtsi,
# app/boards/shields/sofle/sofle_left.overlay,
# app/boards/shields/sofle/sofle_right.overlay,
# app/dts/layouts/josefadamcik/sofle.dtsi.
# Rerun the generator rather than editing this file. Not yet tried on a
# real keyboard.

id = "sofle"
name = "Sofle"
vendor = "josefadamcik"
verified = false
brightness_cap = 100
default_layout = "josefadamcik_sofle_layout"
# The plain keys of the shield's own keymap, in binding order.
starter_keys = [
  "GRAVE", "N1", "N2", "N3", "N4", "N5", "N6", "N7", "N8", "N9", "N0", "",
  "ESC", "Q", "W", "E", "R", "T", "Y", "U", "I", "O", "P", "BSPC",
  "TAB", "A", "S", "D", "F", "G", "H", "J", "K", "L", "SEMI", "SQT",
  "LSHFT", "Z", "X", "C", "V", "B", "C_MUTE", "", "N", "M", "COMMA", "DOT",
  "FSLH", "RSHFT", "LGUI", "LALT", "LCTRL", "", "RET", "SPACE", "", "RCTRL", "RALT", "RGUI",
]

[[usb]]
vendor = 0x1d50
product = 0x615e
name = "Sofle"

[flash]
order = ["left", "right"]

[[halves]]
side = "left"
central = true

[[halves]]
side = "right"
central = false

[[firmware]]
id = "zmk-0.3.0-nice_nano_v2"
name = "ZMK v0.3.0 on nice!nano v2"
zephyr = "3.5"
config_name = "sofle"
workflow = "zmkfirmware/zmk/.github/workflows/build-user-config.yml@v0.3.0"
zmk = { url = "https://github.com/zmkfirmware/zmk", revision = "v0.3.0" }
controller = "nice_nano_v2"
capabilities = ["studio", "rgb-underglow", "ext-power"]
notes = ["Supermini nRF52840 clones ship with the same bootloader and are built as a nice!nano v2."]

[[firmware.builds]]
side = "left"
board = "nice_nano_v2"
shield = "sofle_left"
snippets = ["studio-rpc-usb-uart"]
cmake_args = ["-DCONFIG_ZMK_STUDIO=y"]

[[firmware.builds]]
side = "right"
board = "nice_nano_v2"
shield = "sofle_right"

