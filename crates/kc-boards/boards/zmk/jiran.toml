# app/dts/layouts/kgoh/jian/full.dtsi,
# app/dts/layouts/kgoh/jian/position_map.dtsi.
# Rerun the generator rather than editing this file. Not yet tried on a
# real keyboard.

id = "jiran"
name = "Jiran"
vendor = "Ladniy"
verified = false
brightness_cap = 100
default_layout = "ladniy_jiran_full_layout"
# The plain keys of the shield's own keymap, in binding order.
starter_keys = [
  "ESC", "N1", "N2", "N3", "N4", "N5", "N6", "N7", "N8", "N9", "N0", "MINUS",
  "LGUI", "TAB", "Q", "W", "E", "R", "T", "Y", "U", "I", "O", "P",
  "LBKT", "", "LSHIFT", "A", "S", "D", "F", "G", "H", "J", "K", "L",
  "SEMI", "", "LCTRL", "Z", "X", "C", "V", "B", "N", "M", "COMMA", "DOT",
  "FSLH", "", "", "SPACE", "LALT", "", "BSPC", "",
]

[[usb]]
vendor = 0x1d50
product = 0x615e
name = "Jiran"

[flash]
order = ["left", "right"]

[[halves]]
side = "left"
central = true

[[halves]]
side = "right"
central = false

[[firmware]]
id = "zmk-0.3.0-nice_nano_v2"
name = "ZMK v0.3.0 on nice!nano v2"
zephyr = "3.5"
config_name = "jiran"
workflow = "zmkfirmware/zmk/.github/workflows/build-user-config.yml@v0.3.0"
zmk = { url = "https://github.com/zmkfirmware/zmk", revision = "v0.3.0" }
controller = "nice_nano_v2"
capabilities = ["studio", "ext-power"]
notes = ["Supermini nRF52840 clones ship with the same bootloader and are built as a nice!nano v2."]

[[firmware.builds]]
side = "left"
board = "nice_nano_v2"
shield = "jiran_left"
snippets = ["studio-rpc-usb-uart"]
cmake_args = ["-DCONFIG_ZMK_STUDIO=y"]

[[firmware.builds]]
side = "right"
board = "nice_nano_v2"
shield = "jiran_right"

