id = "corne"
name = "Corne"
vendor = "foostan"
verified = false
brightness_cap = 100
default_layout = "foostan_corne_6col_layout"
# The plain keys of the shield's own keymap, in binding order.
starter_keys = [
  "TAB", "Q", "W", "E", "R", "T", "Y", "U", "I", "O", "P", "BSPC",
  "LCTRL", "A", "S", "D", "F", "G", "H", "J", "K", "L", "SEMI", "SQT",
  "LSHFT", "Z", "X", "C", "V", "B", "N", "M", "COMMA", "DOT", "FSLH", "ESC",
  "LGUI", "", "SPACE", "RET", "", "RALT",
]

[[usb]]
vendor = 0x1d50
product = 0x615e
name = "Corne"

[flash]
order = ["left", "right"]

[[halves]]
side = "left"
central = true

[[halves]]
side = "right"
central = false

[[firmware]]
id = "zmk-0.3.0-nice_nano_v2"
name = "ZMK v0.3.0 on nice!nano v2"
zephyr = "3.5"
config_name = "corne"
workflow = "zmkfirmware/zmk/.github/workflows/build-user-config.yml@v0.3.0"
zmk = { url = "https://github.com/zmkfirmware/zmk", revision = "v0.3.0" }
controller = "nice_nano_v2"
capabilities = ["studio", "rgb-underglow", "ext-power"]
notes = ["Supermini nRF52840 clones ship with the same bootloader and are built as a nice!nano v2."]

[[firmware.builds]]
side = "left"
board = "nice_nano_v2"
shield = "corne_left"
snippets = ["studio-rpc-usb-uart"]
cmake_args = ["-DCONFIG_ZMK_STUDIO=y"]

[[firmware.builds]]
side = "right"
board = "nice_nano_v2"
shield = "corne_right"

