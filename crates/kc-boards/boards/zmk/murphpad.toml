# MurphPad. Generated by the zmk_boards example in kc-import from
# zmkfirmware/zmk at v0.3.0 (MIT): app/boards/shields/murphpad/murphpad-layout.dtsi,
# app/boards/shields/murphpad/murphpad.overlay.
# Rerun the generator rather than editing this file. Not yet tried on a
# real keyboard.

id = "murphpad"
name = "MurphPad"
vendor = "MechWild"
verified = false
brightness_cap = 100
default_layout = "all_1u_layout"
# The plain keys of the shield's own keymap, in binding order.
starter_keys = [
  "F1", "F2", "F3", "F4", "KP_NUM", "KP_DIVIDE", "KP_MULTIPLY", "KP_MINUS", "KP_N7", "KP_N8", "KP_N9", "KP_PLUS",
  "C_MUTE", "KP_N4", "KP_N5", "KP_N6", "", "", "KP_N1", "KP_N2", "KP_N3", "KP_ENTER", "BSPC", "KP_N0",
  "", "KP_DOT", "", "", "", "",
]

[[usb]]
vendor = 0x1d50
product = 0x615e
name = "MurphPad"

[flash]
order = ["whole"]

[[halves]]
side = "whole"
central = true

[[firmware]]
id = "zmk-0.3.0-nice_nano_v2"
name = "ZMK v0.3.0 on nice!nano v2"
zephyr = "3.5"
config_name = "murphpad"
workflow = "zmkfirmware/zmk/.github/workflows/build-user-config.yml@v0.3.0"
zmk = { url = "https://github.com/zmkfirmware/zmk", revision = "v0.3.0" }
controller = "nice_nano_v2"
capabilities = ["rgb-underglow", "ext-power"]
notes = ["Supermini nRF52840 clones ship with the same bootloader and are built as a nice!nano v2."]

[[firmware.builds]]
side = "whole"
board = "nice_nano_v2"
shield = "murphpad"

