# Kyria. Generated by the zmk_boards example in kc-import from
# zmkfirmware/zmk at v0.3.0 (MIT): app/boards/shields/kyria/kyria-layouts.dtsi,
# app/boards/shields/kyria/kyria.dtsi,
# app/boards/shields/kyria/kyria_common.dtsi,
# app/boards/shields/kyria/kyria_left.overlay,
# app/boards/shields/kyria/kyria_right.overlay.
# Rerun the generator rather than editing this file. Not yet tried on a
# real keyboard.

id = "kyria"
name = "Kyria"
vendor = "splitkb"
verified = false
brightness_cap = 100
default_layout = "splitkb_kyria_6col_layout"
# The plain keys of the shield's own keymap, in binding order.
starter_keys = [
  "ESC", "Q", "W", "E", "R", "T", "Y", "U", "I", "O", "P", "BSLH",
  "TAB", "A", "S", "D", "F", "G", "H", "J", "K", "L", "SEMI", "SQT",
  "LSHFT", "Z", "X", "C", "V", "B", "LSHFT", "LSHFT", "", "LSHFT", "N", "M",
  "COMMA", "DOT", "FSLH", "RCTRL", "LGUI", "DEL", "RET", "SPACE", "ESC", "RET", "SPACE", "TAB",
  "BSPC", "RALT",
]

[[usb]]
vendor = 0x1d50
product = 0x615e
name = "Kyria"

[flash]
order = ["left", "right"]

[[halves]]
side = "left"
central = true

[[halves]]
side = "right"
central = false

[[firmware]]
id = "zmk-0.3.0-nice_nano_v2"
name = "ZMK v0.3.0 on nice!nano v2"
zephyr = "3.5"
config_name = "kyria"
workflow = "zmkfirmware/zmk/.github/workflows/build-user-config.yml@v0.3.0"
zmk = { url = "https://github.com/zmkfirmware/zmk", revision = "v0.3.0" }
controller = "nice_nano_v2"
capabilities = ["studio", "rgb-underglow", "ext-power"]
notes = ["Supermini nRF52840 clones ship with the same bootloader and are built as a nice!nano v2."]

[[firmware.builds]]
side = "left"
board = "nice_nano_v2"
shield = "kyria_left"
snippets = ["studio-rpc-usb-uart"]
cmake_args = ["-DCONFIG_ZMK_STUDIO=y"]

[[firmware.builds]]
side = "right"
board = "nice_nano_v2"
shield = "kyria_right"

