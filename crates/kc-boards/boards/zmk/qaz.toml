# QAZ. Generated by the zmk_boards example in kc-import from
# zmkfirmware/zmk at v0.3.0 (MIT): app/boards/shields/qaz/qaz-layouts.dtsi,
# app/boards/shields/qaz/qaz.overlay.
# Rerun the generator rather than editing this file. Not yet tried on a
# real keyboard.

id = "qaz"
name = "QAZ"
vendor = "CB Keyboards"
verified = false
brightness_cap = 100
default_layout = "split_bar_layout"
# The plain keys of the shield's own keymap, in binding order.
starter_keys = [
  "Q", "W", "E", "R", "T", "Y", "U", "I", "O", "P", "", "",
  "", "", "G", "H", "", "", "", "", "Z", "X", "C", "V",
  "B", "N", "M", "COMMA", "DOT", "LSHFT", "LGUI", "LALT", "", "", "COLON", "SQT",
  "FSLH",
]

[[usb]]
vendor = 0x1d50
product = 0x615e
name = "QAZ"

[flash]
order = ["whole"]

[[halves]]
side = "whole"
central = true

[[firmware]]
id = "zmk-0.3.0-nice_nano_v2"
name = "ZMK v0.3.0 on nice!nano v2"
zephyr = "3.5"
config_name = "qaz"
workflow = "zmkfirmware/zmk/.github/workflows/build-user-config.yml@v0.3.0"
zmk = { url = "https://github.com/zmkfirmware/zmk", revision = "v0.3.0" }
controller = "nice_nano_v2"
capabilities = ["studio", "ext-power"]
notes = ["Supermini nRF52840 clones ship with the same bootloader and are built as a nice!nano v2."]

[[firmware.builds]]
side = "whole"
board = "nice_nano_v2"
shield = "qaz"
snippets = ["studio-rpc-usb-uart"]
cmake_args = ["-DCONFIG_ZMK_STUDIO=y"]

