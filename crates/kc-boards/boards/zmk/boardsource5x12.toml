# Boardsource 5x12. Generated by the zmk_boards example in kc-import from
# zmkfirmware/zmk at v0.3.0 (MIT): app/boards/shields/boardsource5x12/boardsource5x12.overlay,
# app/dts/layouts/common/ortho_5x12/all1u.dtsi,
# app/dts/layouts/common/ortho_5x12/position_map.dtsi.
# Rerun the generator rather than editing this file. Not yet tried on a
# real keyboard.

id = "boardsource5x12"
name = "Boardsource 5x12"
vendor = "Boardsource"
verified = false
brightness_cap = 100
default_layout = "layout_ortho_5x12_all1u"
# The plain keys of the shield's own keymap, in binding order.
starter_keys = [
  "ESC", "N1", "N2", "N3", "N4", "N5", "N6", "N7", "N8", "N9", "N0", "BSPC",
  "TAB", "Q", "W", "E", "R", "T", "Y", "U", "I", "O", "P", "BSLH",
  "LSHFT", "A", "S", "D", "F", "G", "H", "J", "K", "L", "SEMI", "SQT",
  "LCTRL", "Z", "X", "C", "V", "B", "N", "M", "COMMA", "DOT", "FSLH", "RET",
  "", "LCTRL", "LALT", "LGUI", "", "SPACE", "SPACE", "", "LEFT", "DOWN", "UP", "RIGHT",
]

[[usb]]
vendor = 0x1d50
product = 0x615e
name = "boardsource5x12"

[flash]
order = ["whole"]

[[halves]]
side = "whole"
central = true

[[firmware]]
id = "zmk-0.3.0-nice_nano_v2"
name = "ZMK v0.3.0 on nice!nano v2"
zephyr = "3.5"
config_name = "boardsource5x12"
workflow = "zmkfirmware/zmk/.github/workflows/build-user-config.yml@v0.3.0"
zmk = { url = "https://github.com/zmkfirmware/zmk", revision = "v0.3.0" }
controller = "nice_nano_v2"
capabilities = ["studio", "ext-power"]
notes = ["Supermini nRF52840 clones ship with the same bootloader and are built as a nice!nano v2."]

[[firmware.builds]]
side = "whole"
board = "nice_nano_v2"
shield = "boardsource5x12"
snippets = ["studio-rpc-usb-uart"]
cmake_args = ["-DCONFIG_ZMK_STUDIO=y"]

