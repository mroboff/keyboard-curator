id = "hummingbird"
name = "Hummingbird"
vendor = "PJE66"
verified = false
brightness_cap = 100
default_layout = "physical_layout0"
# The plain keys of the shield's own keymap, in binding order.
starter_keys = [
  "Q", "W", "E", "R", "T", "H", "U", "I", "O", "P", "", "",
  "", "", "G", "N", "", "", "", "", "X", "C", "V", "M",
  "COMMA", "DOT", "", "RET", "", "",
]

[[usb]]
vendor = 0x1d50
product = 0x615e
name = "Hummingbird"

[flash]
order = ["whole"]

[[halves]]
side = "whole"
central = true

[[firmware]]
id = "zmk-0.3.0-seeeduino_xiao_ble"
name = "ZMK v0.3.0 on Seeed XIAO BLE"
zephyr = "3.5"
config_name = "hummingbird"
workflow = "zmkfirmware/zmk/.github/workflows/build-user-config.yml@v0.3.0"
zmk = { url = "https://github.com/zmkfirmware/zmk", revision = "v0.3.0" }
controller = "seeeduino_xiao_ble"
capabilities = ["studio", "ext-power"]

[[firmware.builds]]
side = "whole"
board = "seeeduino_xiao_ble"
shield = "hummingbird"
snippets = ["studio-rpc-usb-uart"]
cmake_args = ["-DCONFIG_ZMK_STUDIO=y"]

