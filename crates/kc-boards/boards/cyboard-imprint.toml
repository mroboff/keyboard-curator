# Cyboard Imprint (wireless). Transcribed from
# https://github.com/Cyboard-DigitalTailor/zmk-keyboards at tag v2026.07:
# boards/shields/imprint/imprint-layouts.dtsi and imprint.dtsi.

id = "cyboard-imprint"
name = "Imprint"
vendor = "Cyboard"
# ZMK_RGB_UNDERGLOW_BRT_MAX in the shield's Kconfig.defconfig.
brightness_cap = 50
default_layout = "physical_layout_imprint_function_row_full_bottom_row"
# The plain keys of the vendor's factory base layer, in binding order, used
# to start new projects. Empty entries are left transparent.
starter_keys = [
  "ESC", "F1", "F2", "F3", "F4", "F5", "F6", "F7", "F8", "F9", "F10", "F11",
  "EQUAL", "N1", "N2", "N3", "N4", "N5", "N6", "N7", "N8", "N9", "N0", "MINUS",
  "TAB", "Q", "W", "E", "R", "T", "Y", "U", "I", "O", "P", "BSLH",
  "LCTRL", "A", "S", "D", "F", "G", "H", "J", "K", "L", "SEMI", "SQT",
  "LSHFT", "Z", "X", "C", "V", "B", "N", "M", "COMMA", "DOT", "FSLH", "RSHFT",
  "", "", "LGUI", "LALT", "", "", "LBKT", "RBKT", "", "",
  "RET", "DEL", "ESC", "GRAVE", "BSPC", "SPACE",
  "LGUI", "", "", "CAPS", "", "",
]

# ZMK's default USB IDs, which most ZMK keyboards share, and the keyboard
# name from the shield's Kconfig.defconfig.
[[usb]]
vendor = 0x1d50
product = 0x615e
name = "Imprint"

[flash]
# Both halves mount under the same volume name, so the app must sequence them.
order = ["left", "right"]
bootloader_entry = "Double-tap the reset button next to the USB-C port on the half you are flashing."
studio_unlock = "Hold the A and F key positions on the left half together for three seconds."

[[halves]]
side = "left"
central = true
bootloader_volume = "ASSIMILATOR"

# Unverified: ZMK declares a placeholder chain length, so this order is taken
# from the wired (QMK) Imprint's rgb_matrix and must be confirmed on hardware.
[halves.leds]
layout = "physical_layout_imprint_function_row_full_bottom_row"
verified = false
chain = [
  41, 53, 5, 17, 29,
  40, 52, 64, 4, 16, 28,
  39, 51, 63, 3, 15, 27,
  38, 50, 62, 2, 14, 26,
  37, 49, 61, 1, 13, 25,
  36, 48, 60, 0, 12, 24,
  70, 71, 72, 76, 77, 78,
]

[[halves]]
side = "right"
central = false
bootloader_volume = "ASSIMILATOR"

[halves.leds]
layout = "physical_layout_imprint_function_row_full_bottom_row"
verified = false
chain = [
  42, 54, 6, 18, 30,
  43, 55, 65, 7, 19, 31,
  44, 56, 66, 8, 20, 32,
  45, 57, 67, 9, 21, 33,
  46, 58, 68, 10, 22, 34,
  47, 59, 69, 11, 23, 35,
  75, 74, 73, 81, 80, 79,
]

[[pointing]]
name = "Left trackball"
kind = "trackball"
side = "left"
listener = "trackball_central_listener"
x = 700
y = 330
size = 130

[[pointing]]
name = "Right trackball"
kind = "trackball"
side = "right"
listener = "trackball_peripheral_listener"
x = 1050
y = 330
size = 130

[[firmware]]
id = "cyboard-zmk-0.3"
name = "ZMK v0.3.0 with Cyboard's module"
zephyr = "3.5"
config_name = "imprint"
# Pinned to the release whose build container matches this Zephyr.
workflow = "zmkfirmware/zmk/.github/workflows/build-user-config.yml@v0.3.0"
zmk = { url = "https://github.com/zmkfirmware/zmk", revision = "v0.3.0" }
capabilities = ["studio", "rgb-underglow", "ext-power", "pointing"]

# The module's own manifest pulls in Cyboard's PMW3610 trackball driver.
[[firmware.modules]]
name = "zmk-keyboards"
url = "https://github.com/Cyboard-DigitalTailor/zmk-keyboards"
revision = "v2026.07"
import = "config/west.yml"

[[firmware.builds]]
side = "left"
board = "assimilator-bt"
shield = "imprint_left"
snippets = ["studio-rpc-usb-uart"]
cmake_args = ["-DCONFIG_ZMK_STUDIO=y"]

[[firmware.builds]]
side = "right"
board = "assimilator-bt"
shield = "imprint_right"

# Upstream ZMK v0.3.0 with the community per-key lighting work applied; see
# firmware/zmk-v0.3.0-per-key-lighting in this repository. The branch lives in
# a fork and is pinned to a commit.
[[firmware]]
id = "kc-zmk-0.3-perkey"
name = "ZMK v0.3.0 with per-key lighting (experimental)"
zephyr = "3.5"
config_name = "imprint"
workflow = "zmkfirmware/zmk/.github/workflows/build-user-config.yml@v0.3.0"
zmk = { url = "https://github.com/mroboff/zmk", revision = "ebb86151d8bbcb697913110a6b71c95e29fd5151" }
capabilities = ["studio", "rgb-underglow", "ext-power", "pointing", "per-key-lighting"]
lighting = { transparent = true, start_effect = 4, led_map_overlay = true }

[[firmware.modules]]
name = "zmk-keyboards"
url = "https://github.com/Cyboard-DigitalTailor/zmk-keyboards"
revision = "v2026.07"
import = "config/west.yml"

[[firmware.builds]]
side = "left"
board = "assimilator-bt"
shield = "imprint_left"
snippets = ["studio-rpc-usb-uart"]
cmake_args = ["-DCONFIG_ZMK_STUDIO=y"]

[[firmware.builds]]
side = "right"
board = "assimilator-bt"
shield = "imprint_right"

# RMK (https://rmk.rs), a firmware written in Rust. The app generates the
# whole project. The hardware half of its keyboard.toml is below: matrix and
# trackball pins from Cyboard's zmk-keyboards at v2026.07
# (boards/shields/imprint and boards/arm/assimilator-bt), and the key order
# of its layout from the `imprint_function_row_full_bottom_row` transform
# there. RMK has no driver for the LEDs or the battery gauge, so the LED
# power rail is held off and the battery is read from the supply voltage.
#
# The firmware is linked where Cyboard's own starts (0x26000) and kept
# below the settings area at 0xEC000, so that Cyboard's ZMK can be flashed
# back. RMK's own storage sits at 0xC0000.
[[firmware]]
id = "rmk-0.9"
name = "RMK 0.9"
family = "rmk"
experimental = true
config_name = "imprint"
notes = [
  "A different firmware from ZMK, written in Rust. On the Imprint it gives keys, the wireless split and both trackballs. There is no lighting, and the battery level is approximate.",
  "Plain keys, layers, mod-taps, layer-taps, sticky keys, Bluetooth keys and combos carry over. Hold-taps, macros and tap-dances defined in a layout, layer rules and pointing settings do not yet; keys that use them are flagged.",
  "It is built to the same flash layout as Cyboard's firmware, so Cyboard's ZMK can be flashed back. Bluetooth pairings do not carry across: computers must pair again after switching.",
  "It compiles, but has never been run on an Imprint. Treat the first flash as a test, with Cyboard's firmware files at hand.",
]

[firmware.rmk]
flavor = "upstream"
source = { url = "https://github.com/rmk-rs/rmk", revision = "rmk-v0.9.0" }
ble_profiles = 5
flash_origin = 0x26000
flash_length = 0xC6000
hardware = '''
[keyboard]
name = "Imprint"
product_name = "Imprint"
vendor_id = 0x1d50
product_id = 0x615e
manufacturer = "Cyboard"
chip = "nrf52840"

[rmk]
ble_profiles_num = 5

[layout]
rows = 14
cols = 8
map = """
(6,5) (6,4) (6,3) (6,2) (6,1) (6,0) (13,0) (13,1) (13,2) (13,3) (13,4) (13,5)
(5,5) (5,4) (5,3) (5,2) (5,1) (5,0) (12,0) (12,1) (12,2) (12,3) (12,4) (12,5)
(4,5) (4,4) (4,3) (4,2) (4,1) (4,0) (11,0) (11,1) (11,2) (11,3) (11,4) (11,5)
(3,5) (3,4) (3,3) (3,2) (3,1) (3,0) (10,0) (10,1) (10,2) (10,3) (10,4) (10,5)
(2,5) (2,4) (2,3) (2,2) (2,1) (2,0) (9,0) (9,1) (9,2) (9,3) (9,4) (9,5)
(1,5) (1,4) (1,3) (1,2) (1,1) (8,1) (8,2) (8,3) (8,4) (8,5) (0,3) (0,2)
(0,1) (7,1) (7,2) (7,3) (0,7) (0,6) (0,5) (7,5) (7,6) (7,7)
"""

[storage]
start_addr = 0xC0000
num_sectors = 16

[ble]
enabled = true

# No host configurator is built in; the keymap comes from this file.
[host]
vial_enabled = false

[split]
connection = "ble"

[split.central]
rows = 7
cols = 8
row_offset = 0
col_offset = 0
battery_adc_pin = "vddh"

[split.central.matrix]
matrix_type = "normal"
row_pins = ["P1_04", "P0_11", "P0_29", "P1_00", "P0_10", "P0_02", "P0_09"]
col_pins = ["P1_06", "P1_15", "P1_13", "P1_11", "P0_31", "P0_22", "P0_24", "P0_20"]
row2col = true

[[split.central.input_device.pmw3610]]
name = "trackball_left"
id = 0
spi.instance = "bitbang0"
spi.sck = "P0_13"
spi.mosi = "P0_15"
spi.miso = "P0_15"
spi.cs = "P0_19"
motion = "P0_17"
cpi = 600
swap_xy = true

[[split.central.output]]
pin = "P1_02"
low_active = false
initial_state_active = false

[[split.peripheral]]
rows = 7
cols = 8
row_offset = 7
col_offset = 0
battery_adc_pin = "vddh"

[split.peripheral.matrix]
matrix_type = "normal"
row_pins = ["P1_04", "P0_11", "P0_29", "P1_00", "P0_10", "P0_02", "P0_09"]
col_pins = ["P1_06", "P1_15", "P1_13", "P1_11", "P0_31", "P0_22", "P0_24", "P0_20"]
row2col = true

[[split.peripheral.input_device.pmw3610]]
name = "trackball_right"
id = 1
spi.instance = "bitbang0"
spi.sck = "P0_13"
spi.mosi = "P0_15"
spi.miso = "P0_15"
spi.cs = "P0_19"
motion = "P0_17"
cpi = 600
swap_xy = true

[[split.peripheral.output]]
pin = "P1_02"
low_active = false
initial_state_active = false
'''

# colonelpanic's moergo-rmk carried to the Imprint: a fork with a board crate
# for the Imprint (crates/imprint-rmk), the shared firmware behind Moosy
# Research's TailorKey for RMK. As on the MoErgo boards, the firmware comes
# from the fork's releases and the layout is written to the running keyboard
# over Rynk. FORK_OWNER is the GitHub account the fork is published under;
# the revision is the fork's commit and the tag the release its CI makes
# from that commit (its calendar version, the first of that day).
[[firmware]]
id = "imprint-rmk"
name = "RMK for the Imprint (community fork, experimental)"
family = "rmk"
experimental = true
config_name = "imprint"
capabilities = [
  "rgb-underglow", "per-key-lighting", "pointing", "hold-taps", "tap-dance",
  "mod-morph", "macros", "sticky-keys", "opposite-hand-hold",
]
notes = [
  "A different firmware from ZMK: a fork of colonelpanic's moergo-rmk, the community firmware behind Moosy Research's TailorKey for RMK, with a board crate for the Imprint. It adds RGB with animations and blinking keys, bilateral home-row mods and a Keyboard Control layer that shows battery, locks and connection. It is not Cyboard firmware, and Cyboard does not support it.",
  "The firmware comes ready-made from the fork's release, checked against its checksums, and is flashed once per half. The layout is then written straight to the keyboard over USB: keys, hold-taps and their timing profiles, tap-dances, mod-morphs, macros, combos, both trackballs' behavior and per-key colors with lock and battery lights. Nothing is built.",
  "The firmware keeps every color to 50% of full brightness itself (its channel ceiling is 128 of 255 on both halves) and leaves the LED power rail off until there is something to show, so the brightness setting here is a share of that. The LED order is the wired Imprint's, not yet confirmed on this board. The battery level is read from the controller's supply, not the fuel gauge. Nothing here has run on an Imprint yet. Keep Cyboard's firmware files at hand to go back: choose ZMK under Firmware, build it, put each half into its bootloader and flash.",
]

[firmware.rmk]
flavor = "moergo-rmk"
source = { url = "https://github.com/FORK_OWNER/imprint-rmk", revision = "0e16c8d6d8a7d2227c2eca4badde9bbace674c69" }
# dependencies/rmk at that commit: the same RMK the MoErgo boards' firmware
# and the app's Rynk client are pinned to.
rmk_revision = "997b62f54dd29fe7c82f23a2c5b0a18816b4c5ae"
# Five key-selectable profiles, as Cyboard's factory keymap binds BT_SEL 0-4.
ble_profiles = 5
layers = 16
# The release the fork's CI publishes from that commit: the two UF2 files,
# SHA256SUMS and manifest.json in one archive.
release = { repository = "FORK_OWNER/imprint-rmk", tag = "v2026.10.07.1", asset = "imprint-rmk.zip", files = [
  { side = "left", name = "imprint-rmk-0.1.0-lh.uf2" },
  { side = "right", name = "imprint-rmk-0.1.0-rh.uf2" },
] }
# From rmk-palettefx at the pinned submodule, in the firmware's own order.
effects = [
  "Gradient", "Flow", "Vortex", "Sparkle", "Ripple", "Rain", "Reactive",
  "Crosshair", "Tracer", "Keyfall", "Shockwave", "Comet",
]
palettes = [
  "Afterburn", "Amber", "Bad Wolf", "Carnival", "Classic", "Dracula", "Groovy",
  "Not Pink", "Phosphor", "Polarized", "Rose Gold", "Sport", "Synthwave",
  "Thermal", "Viridis", "Watermelon",
]

# The firmware's 14x8 matrix: rows 0-6 are the left half and 7-13 the right,
# as in Cyboard's ZMK matrix transform (imprint.dtsi, row-offset 7), in this
# board's binding order. Rows 0 and 7 are the thumb clusters.
[firmware.rmk.matrix]
rows = 14
cols = 8
positions = [
  [6, 5], [6, 4], [6, 3], [6, 2], [6, 1], [6, 0], [13, 0], [13, 1], [13, 2], [13, 3], [13, 4], [13, 5],
  [5, 5], [5, 4], [5, 3], [5, 2], [5, 1], [5, 0], [12, 0], [12, 1], [12, 2], [12, 3], [12, 4], [12, 5],
  [4, 5], [4, 4], [4, 3], [4, 2], [4, 1], [4, 0], [11, 0], [11, 1], [11, 2], [11, 3], [11, 4], [11, 5],
  [3, 5], [3, 4], [3, 3], [3, 2], [3, 1], [3, 0], [10, 0], [10, 1], [10, 2], [10, 3], [10, 4], [10, 5],
  [2, 5], [2, 4], [2, 3], [2, 2], [2, 1], [2, 0], [9, 0], [9, 1], [9, 2], [9, 3], [9, 4], [9, 5],
  [1, 5], [1, 4], [1, 3], [1, 2], [1, 1], [8, 1], [8, 2], [8, 3], [8, 4], [8, 5],
  [0, 3], [0, 2], [0, 1], [7, 1], [7, 2], [7, 3],
  [0, 7], [0, 6], [0, 5], [7, 5], [7, 6], [7, 7],
]

# The trackballs by RMK pointing-device id: the left half's is device 0,
# the right half's device 1.
[[firmware.rmk.pointing]]
listener = "trackball_central_listener"
device = 0

[[firmware.rmk.pointing]]
listener = "trackball_peripheral_listener"
device = 1

# Its emitter table numbers the left half's LEDs 0-40 and the right half's
# 41-81, each in chain order.
[[firmware.rmk.leds]]
side = "left"
first = 0

[[firmware.rmk.leds]]
side = "right"
first = 41

