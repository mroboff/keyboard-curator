# Cyboard Imprint (wireless). Transcribed from
# https://github.com/Cyboard-DigitalTailor/zmk-keyboards at tag v2026.07:
# boards/shields/imprint/imprint-layouts.dtsi and imprint.dtsi.

id = "cyboard-imprint"
name = "Imprint"
vendor = "Cyboard"
# ZMK_RGB_UNDERGLOW_BRT_MAX in the shield's Kconfig.defconfig.
brightness_cap = 50
default_layout = "physical_layout_imprint_function_row_full_bottom_row"
# The plain keys of the vendor's factory base layer, in binding order, used
# to start new projects. Empty entries are left transparent.
starter_keys = [
  "ESC", "F1", "F2", "F3", "F4", "F5", "F6", "F7", "F8", "F9", "F10", "F11",
  "EQUAL", "N1", "N2", "N3", "N4", "N5", "N6", "N7", "N8", "N9", "N0", "MINUS",
  "TAB", "Q", "W", "E", "R", "T", "Y", "U", "I", "O", "P", "BSLH",
  "LCTRL", "A", "S", "D", "F", "G", "H", "J", "K", "L", "SEMI", "SQT",
  "LSHFT", "Z", "X", "C", "V", "B", "N", "M", "COMMA", "DOT", "FSLH", "RSHFT",
  "", "", "LGUI", "LALT", "", "", "LBKT", "RBKT", "", "",
  "RET", "DEL", "ESC", "GRAVE", "BSPC", "SPACE",
  "LGUI", "", "", "CAPS", "", "",
]

[flash]
# Both halves mount under the same volume name, so the app must sequence them.
order = ["left", "right"]
bootloader_entry = "Double-tap the reset button next to the USB-C port on the half you are flashing."

[[halves]]
side = "left"
central = true
bootloader_volume = "ASSIMILATOR"

# Unverified: ZMK declares a placeholder chain length, so this order is taken
# from the wired (QMK) Imprint's rgb_matrix and must be confirmed on hardware.
[halves.leds]
layout = "physical_layout_imprint_function_row_full_bottom_row"
verified = false
chain = [
  41, 53, 5, 17, 29,
  40, 52, 64, 4, 16, 28,
  39, 51, 63, 3, 15, 27,
  38, 50, 62, 2, 14, 26,
  37, 49, 61, 1, 13, 25,
  36, 48, 60, 0, 12, 24,
  70, 71, 72, 76, 77, 78,
]

[[halves]]
side = "right"
central = false
bootloader_volume = "ASSIMILATOR"

[halves.leds]
layout = "physical_layout_imprint_function_row_full_bottom_row"
verified = false
chain = [
  42, 54, 6, 18, 30,
  43, 55, 65, 7, 19, 31,
  44, 56, 66, 8, 20, 32,
  45, 57, 67, 9, 21, 33,
  46, 58, 68, 10, 22, 34,
  47, 59, 69, 11, 23, 35,
  75, 74, 73, 81, 80, 79,
]

[[pointing]]
name = "Left trackball"
kind = "trackball"
side = "left"
listener = "trackball_central_listener"
x = 700
y = 330
size = 130

[[pointing]]
name = "Right trackball"
kind = "trackball"
side = "right"
listener = "trackball_peripheral_listener"
x = 1050
y = 330
size = 130

[[firmware]]
id = "cyboard-zmk-0.3"
name = "ZMK v0.3.0 with Cyboard's module"
zephyr = "3.5"
config_name = "imprint"
# Pinned to the release whose build container matches this Zephyr.
workflow = "zmkfirmware/zmk/.github/workflows/build-user-config.yml@v0.3.0"
zmk = { url = "https://github.com/zmkfirmware/zmk", revision = "v0.3.0" }
capabilities = ["studio", "rgb-underglow", "ext-power", "pointing"]

# The module's own manifest pulls in Cyboard's PMW3610 trackball driver.
[[firmware.modules]]
name = "zmk-keyboards"
url = "https://github.com/Cyboard-DigitalTailor/zmk-keyboards"
revision = "v2026.07"
import = "config/west.yml"

[[firmware.builds]]
side = "left"
board = "assimilator-bt"
shield = "imprint_left"
snippets = ["studio-rpc-usb-uart"]
cmake_args = ["-DCONFIG_ZMK_STUDIO=y"]

[[firmware.builds]]
side = "right"
board = "assimilator-bt"
shield = "imprint_right"

