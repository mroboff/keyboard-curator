[package]
name = "kc-via"
description = "QMK keyboards with VIA: the VIA protocol over raw HID, keyboard definitions, and layouts to and from the keyboard's keymap"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
kc-boards = { version = "0.1.0", path = "../kc-boards" }
kc-model = { version = "0.1.0", path = "../kc-model" }
kc-zmk = { version = "0.1.0", path = "../kc-zmk" }
# The platform's HID driver, the same one kc-rynk uses.
async-hid = { version = "0.5.3", default-features = false, features = ["tokio", "win32"] }
futures-util = "0.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
tokio = { version = "1", features = ["rt", "time"] }
