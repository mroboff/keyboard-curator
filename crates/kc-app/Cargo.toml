[package]
name = "kc-app"
description = "Keyboard Curator desktop application"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "keyboard-curator"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
dirs = "7.0.0"
gpui-kit = "=0.7.0"
kc-boards = { version = "0.1.0", path = "../kc-boards" }
kc-build = { version = "0.1.0", path = "../kc-build" }
kc-device = { version = "0.1.0", path = "../kc-device" }
kc-emit = { version = "0.1.0", path = "../kc-emit" }
kc-firmware = { version = "0.1.0", path = "../kc-firmware" }
kc-flash = { version = "0.1.0", path = "../kc-flash" }
kc-import = { version = "0.1.0", path = "../kc-import" }
kc-model = { version = "0.1.0", path = "../kc-model" }
kc-studio = { version = "0.1.0", path = "../kc-studio" }
kc-zmk = { version = "0.1.0", path = "../kc-zmk" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
