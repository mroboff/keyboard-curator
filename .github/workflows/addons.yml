name: Add-on catalog

# Keeps the generated half of the ZMK add-on catalog current: each add-on's
# pinned commit, stars and activity, and a list of new repositories worth
# reviewing. Changes arrive as a pull request, never straight on main,
# because a new pin changes what users' firmware is built from.
on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Refresh metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 ci/refresh-addons.py

      - name: Open a pull request if anything changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- crates/kc-zmk/catalog/addons-meta.json; then
            echo "Nothing changed."
            exit 0
          fi
          branch="addons/refresh-$(date +%Y-%m-%d)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add crates/kc-zmk/catalog/addons-meta.json
          git commit -m "Refresh the ZMK add-on catalog metadata"
          git push --force origin "$branch"
          gh pr create \
            --title "Refresh the ZMK add-on catalog metadata" \
            --body "Generated by ci/refresh-addons.py. Review any moved pins before merging: they change what firmware is built from. New entries under \`candidates\` are repositories to consider adding to addons.toml by hand, or to list under \`ignore\` there." \
            || echo "A pull request for this branch is already open."
